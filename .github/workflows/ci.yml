name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"

jobs:
  build-typescript:
    name: Build TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@23da06e2c4d5804d2082ecf4d79b83a2338fb419 # v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set env variables
        run: cp apps/webapp/.env.local.example apps/webapp/.env

      - name: Set project example
        uses: actions/checkout@v7
        with:
          repository: react/react
          path: docs/project-example/react
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 500
          persist-credentials: false

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Check architecture boundaries
        run: pnpm run lint:arch

      - name: Build workspace
        env:
          SMM_STORE_DATA_AT: /home/runner/work/software-metrics-machine/software-metrics-machine/docs/project-example
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@23da06e2c4d5804d2082ecf4d79b83a2338fb419 # v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run tests
        run: pnpm run test

  cli-acceptance:
    name: CLI Acceptance
    runs-on: ubuntu-latest
    needs: [build-typescript, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@23da06e2c4d5804d2082ecf4d79b83a2338fb419 # v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: build
        run: pnpm run build

      - name: Install bashunit
        working-directory: apps/cli
        run: |
          mkdir -p lib
          curl -sSL -o install-bashunit.sh https://bashunit.com/install.sh
          bash install-bashunit.sh

      - name: Install expect (for interactive wizard e2e tests)
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Run CLI bashunit e2e tests
        run: cd apps/cli && pnpm run test:e2e

  check-distribution:
    name: Check Distribution
    runs-on: ubuntu-latest
    needs: [build-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@23da06e2c4d5804d2082ecf4d79b83a2338fb419 # v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Set env variables
        run: cp apps/webapp/.env.local.example apps/webapp/.env

      - name: Set project example
        run: git clone --shallow-since="2025-03-01" https://github.com/facebook/react tmp/react

      - name: Check package distribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMM_STORE_DATA_AT: /home/runner/work/software-metrics-machine/software-metrics-machine/docs/project-example
        run: ./scripts/simulate-and-test-publish.sh build

  webapp-e2e:
    name: Webapp Cypress Journeys
    runs-on: ubuntu-latest
    needs: [build-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@23da06e2c4d5804d2082ecf4d79b83a2338fb419 # v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # `--ignore-scripts` is the convention for every job, so the Cypress
        # binary is installed explicitly in the next step.
        run: pnpm install --ignore-scripts

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install Cypress binary
        run: pnpm --filter @smmachine/webapp exec cypress install

      - name: Install Chrome for Testing
        id: chrome
        # Chrome for Testing is the suite default (see cypress.config.ts); it is
        # pinned and built for automation, unlike the auto-updating stable Chrome.
        # Pin `chrome-version` to an exact build to make CI fully reproducible.
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run webapp Cypress journeys
        env:
          # Pass the exact binary so the run does not depend on browser detection.
          E2E_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm --filter @smmachine/webapp cy:run

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/webapp/cypress/screenshots
          retention-days: 5
          if-no-files-found: ignore

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [build-typescript, test, cli-acceptance, check-distribution, webapp-e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Environment Variables
        uses: tw3lveparsecs/github-actions-setvars@23da06e2c4d5804d2082ecf4d79b83a2338fb419 # v0.2
        with:
          envFilePath: ./envvars.for.actions

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --ignore-scripts
          pnpm run build

      - name: Collect merged coverage
        run: pnpm run coverage:all

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
